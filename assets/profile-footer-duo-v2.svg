 <g class="wave"><path d="M54 55 63 46" stroke="#56ded8" stroke-width="3.5" stroke-linecap="round"/><circle cx="64" cy="44" r="3.2" fill="#d39cff" stroke="#fff" stroke-width="1"/></g>
 <g class="leg-a"><path d="M26 75v5l-3 5v4" fill="none" stroke="#56ded8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="80" r="1.8" fill="#f1fffc"/><path d="M23 89h-5l-3 3h11" fill="#173a4c" stroke="#d39cff" stroke-width="1.5" stroke-linejoin="round"/></g>
