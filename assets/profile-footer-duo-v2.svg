<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 104" width="800" height="104" role="img" aria-labelledby="title desc">
<title id="title">Two original cyber robot companions</title>
<desc id="desc">A squat violet workshop walker with an off-center camera eye and a sleek tapered teal scout with a curved face visor walk toward one another, wave across a wide gap, then return.</desc>
<defs>
 <linearGradient id="violet-shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9a3f2"/><stop offset=".42" stop-color="#66518f"/><stop offset="1" stop-color="#211c37"/></linearGradient>
 <linearGradient id="violet-side" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#514078"/><stop offset="1" stop-color="#141824"/></linearGradient>
 <linearGradient id="teal-shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2fff9"/><stop offset=".45" stop-color="#56a9a7"/><stop offset="1" stop-color="#183947"/></linearGradient>
 <linearGradient id="teal-side" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#37898e"/><stop offset="1" stop-color="#152337"/></linearGradient>
 <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#183746"/><stop offset="1" stop-color="#0b1725"/></linearGradient>
 <radialGradient id="lens" cx=".32" cy=".25"><stop stop-color="#fff"/><stop offset=".35" stop-color="#b5fff4"/><stop offset="1" stop-color="#53d9d2"/></radialGradient>
 <filter id="glow" x="-.6" y="-.6" width="2.2" height="2.2"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
@keyframes trace{to{stroke-dashoffset:-100}}
@keyframes approach-left{0%,9%,91%,100%{transform:translateX(0)}38%,62%{transform:translateX(136px)}}
@keyframes approach-right{0%,9%,91%,100%{transform:translateX(0)}38%,62%{transform:translateX(-136px)}}
@keyframes bounce{0%,9%,38%,62%,91%,100%{transform:translateY(0) rotate(0)}14%,26%,34%,67%,79%,87%{transform:translateY(-3px) rotate(-1.5deg)}20%,31%,72%,84%{transform:translateY(0) rotate(1.5deg)}}
@keyframes step-a{0%,9%,38%,62%,91%,100%{transform:rotate(0)}14%,26%,34%,67%,79%,87%{transform:rotate(26deg)}20%,31%,72%,84%{transform:rotate(-26deg)}}
@keyframes step-b{0%,9%,38%,62%,91%,100%{transform:rotate(0)}14%,26%,34%,67%,79%,87%{transform:rotate(-26deg)}20%,31%,72%,84%{transform:rotate(26deg)}}
@keyframes arm-swing{0%,9%,38%,62%,91%,100%{transform:rotate(0)}14%,26%,34%,67%,79%,87%{transform:rotate(-15deg)}20%,31%,72%,84%{transform:rotate(15deg)}}
@keyframes wave{0%,38%,62%,100%{transform:rotate(0)}41%,45%,49%,53%,57%{transform:rotate(-32deg)}43%,47%,51%,55%,59%{transform:rotate(-8deg)}}
@keyframes curious{0%,38%,62%,100%{transform:rotate(0)}42%,49%,55%{transform:rotate(-5deg)}46%,52%,59%{transform:rotate(3deg)}}
@keyframes hello-a{0%,39%,50%,100%{opacity:0}42%,48%{opacity:1}}
@keyframes hello-b{0%,49%,63%,100%{opacity:0}52%,61%{opacity:1}}
@keyframes blink{0%,43%,46%,100%{transform:scaleY(1)}44.5%{transform:scaleY(.12)}}
@keyframes beacon{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes shadow{0%,9%,38%,62%,91%,100%{transform:scaleX(1);opacity:.27}14%,26%,34%,67%,79%,87%{transform:scaleX(.78);opacity:.14}20%,31%,72%,84%{transform:scaleX(1.08);opacity:.3}}
.trace{animation:trace 7s linear infinite}
.approach-left{animation:approach-left 8s cubic-bezier(.42,0,.25,1) infinite}
.approach-right{animation:approach-right 8s cubic-bezier(.42,0,.25,1) infinite}
.bounce{transform-box:fill-box;transform-origin:center bottom;animation:bounce 8s linear infinite}
.leg-a,.leg-b{transform-box:fill-box;transform-origin:50% 0}
.leg-a{animation:step-a 8s linear infinite}.leg-b{animation:step-b 8s linear infinite}
.swing,.wave,.curious{transform-box:fill-box;transform-origin:50% 0}
.swing{animation:arm-swing 8s linear infinite}.wave{animation:wave 8s ease-in-out infinite}
.curious{animation:curious 8s ease-in-out infinite}
.shadow{transform-box:fill-box;transform-origin:center;animation:shadow 8s linear infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5.2s ease-in-out infinite}
.beacon{animation:beacon 2.4s ease-in-out infinite}
.hello-a,.hello-b{opacity:0}
.hello-a{animation:hello-a 8s ease-in-out infinite}.hello-b{animation:hello-b 8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.trace,.approach-left,.approach-right,.bounce,.leg-a,.leg-b,.swing,.wave,.curious,.shadow,.eye,.beacon,.hello-a,.hello-b{animation:none}.hello-a,.hello-b{opacity:0}}
</style>
<path d="M0 94h245l9-7h27l9 7h36M468 94h36l9-7h27l9 7h251" fill="none" stroke="#9b65d7" stroke-opacity=".3"/>
<path class="trace" d="M0 94h245l9-7h27l9 7h36M468 94h36l9-7h27l9 7h251" fill="none" stroke="#56ded8" stroke-width="1.2" stroke-dasharray="4 48"/>
<g class="hello-a"><path d="M352 11h36q4 0 4 4v12q0 4-4 4h-13l-5 5v-5h-18q-4 0-4-4V15q0-4 4-4z" fill="#171827" stroke="#9b65d7" stroke-width="1.2"/><text x="370" y="24" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#e1d1ff">HI!</text></g>
<g class="hello-b"><path d="M412 11h37q4 0 4 4v12q0 4-4 4h-16v5l-5-5h-16q-4 0-4-4V15q0-4 4-4z" fill="#171827" stroke="#56ded8" stroke-width="1.2"/><text x="431" y="24" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#c9fff8">HEY!</text></g>
<!-- Rook: squat workshop walker, with an offset optical head and compact leg frame -->
