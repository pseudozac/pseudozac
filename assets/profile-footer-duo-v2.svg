 <g class="swing"><path d="M17 53 7 65" stroke="#9b65d7" stroke-width="4.2" stroke-linecap="round"/><path d="M7 64 3 67l5 2 4-3z" fill="#514078" stroke="#d1bdff" stroke-width="1"/></g>
 <g class="wave"><path d="M61 53 70 43" stroke="#9b65d7" stroke-width="4.2" stroke-linecap="round"/><path d="m69 44 1-5 4 3-1 5z" fill="#56ded8" stroke="#c9fff8" stroke-width="1"/></g>
 <g class="leg-a"><path d="M25 74v5l-4 5v4" fill="none" stroke="#9b65d7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21" cy="79" r="2" fill="#d1bdff"/><path d="M21 88h-6l-3 3h12" fill="#33274e" stroke="#56ded8" stroke-width="1.5" stroke-linejoin="round"/></g>
 <g class="leg-b"><path d="M55 74v5l4 5v4" fill="none" stroke="#9b65d7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="59" cy="79" r="2" fill="#d1bdff"/><path d="M59 88h6l3 3H56" fill="#33274e" stroke="#56ded8" stroke-width="1.5" stroke-linejoin="round"/></g>
 <g class="curious">
  <path d="M16 18q2-7 11-7h32q8 1 10 8v20q-3 9-13 10H22Q13 47 12 39V26q0-5 4-8z" fill="url(#violet-shell)" stroke="#d8ccff" stroke-width="1.8"/>
  <path d="m56 14 13 5v17l-13 4z" fill="url(#violet-side)" stroke="#8569bc" stroke-width="1"/>
  <path d="M18 20q20-8 37-1v17q-19 7-37 0z" fill="url(#face)" stroke="#8975b4" stroke-width="1"/>
  <path d="M22 21q14-5 29 0" fill="none" stroke="#eee8ff" stroke-opacity=".65" stroke-width="1.3"/>
  <circle class="eye" cx="34" cy="28" r="7" fill="#101c2a" stroke="#56ded8" stroke-width="1.4"/>
  <circle cx="34" cy="28" r="4.2" fill="url(#lens)" filter="url(#glow)"/><circle cx="32.5" cy="26.5" r="1.2" fill="#fff"/>
  <circle cx="51" cy="27" r="3.3" fill="#101c2a" stroke="#b9a3f2" stroke-width="1.2"/><circle cx="51" cy="27" r="1.6" fill="#56ded8"/>
  <path d="M23 39h6m3 0h5m3 0h4" stroke="#d1bdff" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M24 12V6" stroke="#9b65d7" stroke-width="2" stroke-linecap="round"/><circle class="beacon" cx="24" cy="5" r="2.7" fill="#56ded8" filter="url(#glow)"/>
 </g>
</g></g></g>
<!-- Mira: slim pearl-teal scout with a tapered shell, cheek fins, and curved glass face -->
