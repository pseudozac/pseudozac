<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">G'day from Isaak, a.k.a. pseudozac</title>
  <desc id="desc">An editorial cyber-inspired banner with Isaak's name and cybersecurity focus beside an abstract neon prism.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131f"/>
      <stop offset=".53" stop-color="#21142f"/>
      <stop offset="1" stop-color="#082c39"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c4ff52"/>
      <stop offset=".52" stop-color="#55e2cf"/>
      <stop offset="1" stop-color="#d89bff"/>
    </linearGradient>
    <linearGradient id="prismFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55e2cf" stop-opacity=".36"/>
      <stop offset=".55" stop-color="#a070ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff77c8" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#58e8d0" stop-opacity=".3"/>
      <stop offset=".55" stop-color="#8b58ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#8b58ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d8dcf6" fill-opacity=".12"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#dots)"/>
  <ellipse cx="963" cy="180" rx="210" ry="176" fill="url(#aura)" filter="url(#blur)"/>
  <path d="M0 324C244 285 417 352 658 303S1015 267 1200 218" fill="none" stroke="#6ce8d2" stroke-opacity=".14" stroke-width="1.5"/>
  <path d="M0 342C265 300 421 366 678 319S1035 286 1200 236" fill="none" stroke="#bd8bff" stroke-opacity=".13" stroke-width="1.5"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="68" y="66" width="4" height="226" rx="2" fill="url(#accent)"/>
    <text x="96" y="88" fill="#c4ff52" font-size="13" font-weight="700" letter-spacing="3.6">G'DAY, INTERNET</text>
    <text x="91" y="177" fill="#f8f6ff" font-size="84" font-weight="800" letter-spacing="-4">ISAAK</text>
    <text x="359" y="162" fill="#d9c7ff" font-size="21" font-weight="600" letter-spacing=".5">a.k.a. pseudozac</text>
    <text x="98" y="218" fill="#c4c8dc" font-size="14" font-weight="650" letter-spacing="1.3">CYBERSECURITY  /  THREAT HUNTING  /  SECURITY ENGINEERING</text>
    <path d="M98 248H507" stroke="#bec4df" stroke-opacity=".24"/>
    <text x="98" y="275" fill="#8eeadd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.4">INVESTIGATE  ·  CONNECT  ·  EXPLAIN</text>
  </g>

  <g transform="translate(952 177)">
    <path d="M-156 40C-139-61-45-141 49-112C134-86 164-13 117 54C78 109-1 140-78 111C-126 92-166 10-106-62" fill="none" stroke="url(#accent)" stroke-opacity=".65" stroke-width="2.2"/>
    <path d="M-126-9C-105-91-6-124 71-78C126-45 133 19 79 73C24 128-59 117-95 64" fill="none" stroke="#e8d7ff" stroke-opacity=".26" stroke-width="1.4"/>
    <path d="M0-116L96-60L96 50L0 106L-96 50L-96-60Z" fill="#111827" fill-opacity=".62" stroke="url(#accent)" stroke-opacity=".7" stroke-width="1.8"/>
    <path d="M0-116V-5L96 50M0-5L-96 50M-96-60L0-5L96-60M0-5V106" fill="none" stroke="#a3b7d6" stroke-opacity=".34" stroke-width="1.3"/>
    <path d="M-96-60L0-116L96-60L0-5Z" fill="url(#prismFace)" fill-opacity=".68"/>
    <path d="M-96 50L0-5L96 50L0 106Z" fill="url(#prismFace)" fill-opacity=".44"/>
    <rect x="-43" y="-35" width="86" height="60" rx="18" fill="#101727" stroke="#c4ff52" stroke-opacity=".8"/>
    <text x="0" y="7" text-anchor="middle" fill="#f8f6ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" letter-spacing="-2">IZ</text>
    <circle cx="-96" cy="-60" r="5" fill="#c4ff52"/>
    <circle cx="96" cy="-60" r="5" fill="#55e2cf"/>
    <circle cx="-96" cy="50" r="5" fill="#d89bff"/>
    <circle cx="96" cy="50" r="5" fill="#ff77c8"/>
    <circle cx="0" cy="-116" r="5" fill="#55e2cf"/>
    <circle cx="0" cy="106" r="5" fill="#c4ff52"/>
  </g>
</svg>
