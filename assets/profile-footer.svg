<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 92" width="800" height="92" role="img" aria-labelledby="title desc">
<title id="title">Stay curious. Follow the evidence.</title>
<desc id="desc">A neon circuit line closes Isaak's profile.</desc>
<style>@keyframes trace{to{stroke-dashoffset:-100}}.trace{animation:trace 6s linear infinite}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style>
