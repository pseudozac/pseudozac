<path d="M0 46h65l14-14h35l28 28h40l14-14h34m340 0h35l14-14h35l28 28h40l14-14h69" fill="none" stroke="#3d3559"/>
<path class="trace" d="M0 46h65l14-14h35l28 28h40l14-14h34m340 0h35l14-14h35l28 28h40l14-14h69" fill="none" stroke="#5ef5d2" stroke-width="2" stroke-dasharray="6 44"/>
<text x="400" y="42" text-anchor="middle" font-family="monospace" font-size="22" letter-spacing="2" fill="#dbe7ff">STAY CURIOUS.</text>
<text x="400" y="65" text-anchor="middle" font-family="monospace" font-size="14" letter-spacing="2" fill="#b494ff">FOLLOW THE EVIDENCE.</text>
