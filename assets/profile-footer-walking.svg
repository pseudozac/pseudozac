.trace{animation:trace 7s linear infinite}
.approach-left{animation:approach-left 8s linear infinite}
.approach-right{animation:approach-right 8s linear infinite}
.bounce{transform-box:fill-box;transform-origin:center bottom;animation:bounce 8s linear infinite}
.leg-a,.leg-b{transform-box:fill-box;transform-origin:50% 0}
.leg-a{animation:step-a 8s linear infinite}.leg-b{animation:step-b 8s linear infinite}
.calf-a,.calf-b{transform-box:fill-box;transform-origin:50% 0}
.calf-a{animation:knee-a 8s linear infinite}.calf-b{animation:knee-b 8s linear infinite}
.sole-a,.sole-b{transform-box:fill-box;transform-origin:center}
.sole-a{animation:sole-a 8s linear infinite}.sole-b{animation:sole-b 8s linear infinite}
.swing,.wave,.curious{transform-box:fill-box;transform-origin:50% 0}
.swing{animation:arm-swing 8s linear infinite}.wave{animation:wave 8s ease-in-out infinite}
.curious{animation:curious 8s ease-in-out infinite}
.shadow{transform-box:fill-box;transform-origin:center;animation:shadow 8s linear infinite}
.wheel-spin{transform-box:fill-box;transform-origin:center;animation:wheel-roll 8s linear infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5.2s ease-in-out infinite}
.beacon{animation:beacon 2.4s ease-in-out infinite}
.hello-a,.hello-b{opacity:0}
.hello-a{animation:hello-a 8s ease-in-out infinite}.hello-b{animation:hello-b 8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.trace,.approach-left,.approach-right,.bounce,.leg-a,.leg-b,.calf-a,.calf-b,.sole-a,.sole-b,.swing,.wave,.curious,.shadow,.eye,.beacon,.wheel-spin,.hello-a,.hello-b{animation:none}.hello-a,.hello-b{opacity:0}}
