    <circle r="86" fill="none" stroke="#50e5d0" stroke-opacity=".28" stroke-width="1.5"/>
    <circle r="58" fill="none" stroke="#50e5d0" stroke-opacity=".22" stroke-width="1.5"/>
    <circle r="29" fill="none" stroke="#50e5d0" stroke-opacity=".18" stroke-width="1"/>
    <path d="M-113 0H113M0-113V113M-80-80L80 80M80-80L-80 80" stroke="#9ba6c8" stroke-opacity=".14"/>
