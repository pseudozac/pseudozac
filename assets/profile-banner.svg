    <text x="76" y="78" fill="#c4ff52" font-size="14" font-weight="700" letter-spacing="3">HELLO, I'M</text>
    <text x="72" y="168" fill="#f5f5ff" font-size="82" font-weight="800" letter-spacing="-3">ISAAK</text>
    <text x="78" y="208" fill="#c2c5dc" font-size="16" font-weight="600" letter-spacing="2">CYBERSECURITY  /  INVESTIGATION  /  AUTOMATION</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1">
      <rect x="78" y="238" width="127" height="34" rx="17" fill="#c4ff52" fill-opacity=".12" stroke="#c4ff52" stroke-opacity=".52"/>
      <text x="97" y="260" fill="#d8ff9a">THREAT HUNT</text>
      <rect x="218" y="238" width="113" height="34" rx="17" fill="#50e5d0" fill-opacity=".11" stroke="#50e5d0" stroke-opacity=".48"/>
      <text x="237" y="260" fill="#8bf2e5">RESPOND</text>
      <rect x="344" y="238" width="112" height="34" rx="17" fill="#bb8cff" fill-opacity=".12" stroke="#bb8cff" stroke-opacity=".5"/>
      <text x="363" y="260" fill="#d0b5ff">AUTOMATE</text>
    </g>
