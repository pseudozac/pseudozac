<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Isaak Hayong — cybersecurity, investigation, automation</title>
  <desc id="desc">A midnight blue and violet cyber-inspired banner with bright cyan and lime accents, signal paths, and a shield graphic.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111323"/>
      <stop offset=".56" stop-color="#19152f"/>
      <stop offset="1" stop-color="#092e38"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4ff52"/>
      <stop offset="1" stop-color="#50e5d0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a6b2db" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="28" fill="url(#grid)"/>
  <circle cx="988" cy="170" r="118" fill="#35d8c7" opacity=".12" filter="url(#softGlow)"/>
  <path d="M0 292C248 242 362 356 609 288s367-28 591-124" fill="none" stroke="#bb8cff" stroke-opacity=".16" stroke-width="2"/>
  <path d="M0 310C251 259 373 366 624 302s366-28 576-125" fill="none" stroke="#4de3d0" stroke-opacity=".2" stroke-width="1.5"/>
