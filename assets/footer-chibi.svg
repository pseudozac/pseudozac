<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 190" width="180" height="190" role="img" aria-labelledby="title desc">
<title id="title">Cyberpunk chibi mascot</title>
<desc id="desc">A small violet-haired chibi in a dark hoodie, waving beside a glowing cyan emblem.</desc>
<style>
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,46%,49%,100%{transform:scaleY(1)}47.5%{transform:scaleY(.08)}}
@keyframes glow{0%,100%{opacity:.65}50%{opacity:1}}
.float{animation:float 3.6s ease-in-out infinite;transform-origin:90px 104px}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5.4s ease-in-out infinite}
.glow{animation:glow 2.8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.float,.eye,.glow{animation:none}}
</style>
<ellipse cx="91" cy="180" rx="43" ry="5" fill="#111827" opacity=".12"/>
<g class="float" stroke-linecap="round" stroke-linejoin="round">
  <!-- waving arm and hand -->
  <path d="M58 126 43 112" fill="none" stroke="#20213a" stroke-width="13"/>
  <path d="m49 120-9-8" fill="none" stroke="#9b65d7" stroke-width="12"/>
  <path d="M39 113c-3-5-2-10 1-13 2 3 3 5 3 8 2-5 5-8 8-8 0 4-1 7-4 10 4-2 7-2 9 0-2 4-6 6-11 6" fill="#f3c9b7" stroke="#e5a9b6" stroke-width="1.5"/>
  <path class="glow" d="m33 91 2.5 5.5 5.5 2.5-5.5 2.5-2.5 5.5-2.5-5.5-5.5-2.5 5.5-2.5z" fill="#58e6e0" stroke="none"/>
  <!-- legs and boots -->
  <path d="m72 164-2 9q-8 1-9 6h26l-2-15m24 0 2 9q8 1 9 6H94l2-15" fill="#24223e" stroke="#7049a8" stroke-width="2"/>
  <path d="M62 179h25m7 0h26" fill="none" stroke="#55dfdc" stroke-width="2"/>
  <!-- hoodie -->
  <path d="M70 107q-13 3-18 17l-5 35q18 13 43 13t43-13l-5-35q-5-14-18-17l-9 9H79z" fill="#17182d" stroke="#7952b2" stroke-width="2.5"/>
  <path d="M67 115q-9 9-10 27m56-27q9 9 10 27" fill="none" stroke="#34304f" stroke-width="3"/>
  <path d="m78 110 12 13 12-13" fill="none" stroke="#47d6d2" stroke-width="2.5"/>
  <path d="M90 122v32m-10-28 10 8 10-8" fill="none" stroke="#8a64c8" stroke-width="2"/>
  <path d="M75 146h30l-4 15H79z" fill="#202239" stroke="#393556" stroke-width="1.5"/>
  <path class="glow" d="m90 147 8 5-8 5-8-5z" fill="#0f3037" stroke="#55e6df" stroke-width="1.5"/>
  <text x="90" y="154" text-anchor="middle" font-family="monospace" font-size="6" font-weight="700" fill="#b8fff4">IZ</text>
  <!-- head, ears, and face -->
  <path d="M48 65q-8-10-4-25l9 7q3-20 21-27l-1 10q13-15 30-12l-5 10q20-3 29 11l-9 2q15 13 11 34l-8 11H52z" fill="#382256" stroke="#a777e7" stroke-width="2.5"/>
  <path d="M49 59q-10-4-10 6t11 10m80-16q10-4 10 6t-11 10" fill="#f0bcba" stroke="#a777e7" stroke-width="2"/>
  <path d="M48 65q-5 32 13 44l8-9 8 10q13 5 26 0l8-10 10 9q16-17 11-46-13 5-21-7-13 14-31 7-15 7-30 2z" fill="#f3c9b7" stroke="#a777e7" stroke-width="2"/>
  <path d="M49 66q14 8 29-1 17 8 32-7 5 10 14 12-1-18-13-24-4-14-20-17-22-4-35 12-9 9-7 25z" fill="#432864" stroke="#a777e7" stroke-width="2"/>
