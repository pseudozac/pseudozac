  <ellipse class="eye" cx="105" cy="75" rx="4" ry="6.5" fill="#243554"/>
  <circle cx="79" cy="73" r="1.7" fill="#fff"/>
  <circle cx="106" cy="73" r="1.7" fill="#fff"/>
  <path d="M87 87q3 2 6 0m-15 9q12 9 24 0" fill="none" stroke="#b95f83" stroke-width="2" stroke-linecap="round"/>
  <path d="M61 87q5-3 10 0m35 0q5-3 10 0" fill="none" stroke="#ee8eaa" stroke-width="3" opacity=".6"/>
  <!-- tech hair clips and headset -->
  <path class="glow" d="m49 57 11 3-2 13-11-3z" fill="#182f43" stroke="#50e2dc" stroke-width="2"/>
  <path d="m54 61 4 1-1 5-4-1z" fill="#d4f9f6"/>
