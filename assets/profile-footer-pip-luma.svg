<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 96" width="800" height="96" role="img" aria-labelledby="title desc">
<title id="title">Pip and Luma, original robot companions</title>
<desc id="desc">A warm, sturdy helper bot and a sleek pearl-and-teal companion walk toward one another, greet across a wide gap, then return to their starting places.</desc>
<defs>
  <linearGradient id="amber-shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd28a"/><stop offset=".42" stop-color="#df843e"/><stop offset="1" stop-color="#7d422d"/></linearGradient>
  <linearGradient id="amber-side" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a85232"/><stop offset="1" stop-color="#4d3140"/></linearGradient>
  <linearGradient id="pearl-shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8e9"/><stop offset=".48" stop-color="#b8e8e2"/><stop offset="1" stop-color="#4b9da5"/></linearGradient>
  <linearGradient id="pearl-side" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#61b7bb"/><stop offset="1" stop-color="#26485f"/></linearGradient>
  <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#173749"/><stop offset="1" stop-color="#091723"/></linearGradient>
  <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".35" stop-color="#a8fff4"/><stop offset="1" stop-color="#44c9d1"/></linearGradient>
  <filter id="glow" x="-.6" y="-.6" width="2.2" height="2.2"><feGaussianBlur stdDeviation="1.7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
@keyframes trace{to{stroke-dashoffset:-100}}
@keyframes approach-left{0%,9%,91%,100%{transform:translateX(0)}38%,62%{transform:translateX(140px)}}
@keyframes approach-right{0%,9%,91%,100%{transform:translateX(0)}38%,62%{transform:translateX(-140px)}}
@keyframes body-bob{0%,9%,38%,62%,91%,100%{transform:translateY(0) rotate(0)}14%,26%,34%,67%,79%,87%{transform:translateY(-3px) rotate(-1.5deg)}20%,31%,72%,84%{transform:translateY(0) rotate(1.5deg)}}
@keyframes step-a{0%,9%,38%,62%,91%,100%{transform:rotate(0)}14%,26%,34%,67%,79%,87%{transform:rotate(25deg)}20%,31%,72%,84%{transform:rotate(-25deg)}}
@keyframes step-b{0%,9%,38%,62%,91%,100%{transform:rotate(0)}14%,26%,34%,67%,79%,87%{transform:rotate(-25deg)}20%,31%,72%,84%{transform:rotate(25deg)}}
@keyframes arm-swing{0%,9%,38%,62%,91%,100%{transform:rotate(0)}14%,26%,34%,67%,79%,87%{transform:rotate(-15deg)}20%,31%,72%,84%{transform:rotate(15deg)}}
@keyframes wave{0%,38%,62%,100%{transform:rotate(0)}41%,45%,49%,53%,57%{transform:rotate(-32deg)}43%,47%,51%,55%,59%{transform:rotate(-8deg)}}
@keyframes hello-a{0%,39%,50%,100%{opacity:0}42%,48%{opacity:1}}
@keyframes hello-b{0%,49%,63%,100%{opacity:0}52%,61%{opacity:1}}
@keyframes blink{0%,42%,45%,100%{transform:scaleY(1)}43.5%{transform:scaleY(.12)}}
@keyframes beacon{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ground-shadow{0%,9%,38%,62%,91%,100%{transform:scaleX(1);opacity:.27}14%,26%,34%,67%,79%,87%{transform:scaleX(.78);opacity:.14}20%,31%,72%,84%{transform:scaleX(1.08);opacity:.3}}
.trace{animation:trace 7s linear infinite}
.approach-left{animation:approach-left 8s cubic-bezier(.42,0,.25,1) infinite}
.approach-right{animation:approach-right 8s cubic-bezier(.42,0,.25,1) infinite}
.bob{transform-box:fill-box;transform-origin:center bottom;animation:body-bob 8s linear infinite}
.leg-a,.leg-b{transform-box:fill-box;transform-origin:50% 0}
.leg-a{animation:step-a 8s linear infinite}.leg-b{animation:step-b 8s linear infinite}
.swing,.wave{transform-box:fill-box;transform-origin:50% 0}
.swing{animation:arm-swing 8s linear infinite}.wave{animation:wave 8s ease-in-out infinite}
.shadow{transform-box:fill-box;transform-origin:center;animation:ground-shadow 8s linear infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5.2s ease-in-out infinite}
.beacon{animation:beacon 2.4s ease-in-out infinite}
.hello-a,.hello-b{opacity:0}
.hello-a{animation:hello-a 8s ease-in-out infinite}.hello-b{animation:hello-b 8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.trace,.approach-left,.approach-right,.bob,.leg-a,.leg-b,.swing,.wave,.shadow,.eye,.beacon,.hello-a,.hello-b{animation:none}.hello-a,.hello-b{opacity:0}}
</style>
<path d="M0 84h260l9-7h23l9 7h28M471 84h28l9-7h23l9 7h260" fill="none" stroke="#9b65d7" stroke-opacity=".28"/>
<path class="trace" d="M0 84h260l9-7h23l9 7h28M471 84h28l9-7h23l9 7h260" fill="none" stroke="#55dbd0" stroke-width="1.2" stroke-dasharray="4 48"/>
<g class="hello-a">
  <path d="M348 11h37q4 0 4 4v12q0 4-4 4h-14l-5 5v-5h-18q-4 0-4-4V15q0-4 4-4z" fill="#151b2a" stroke="#ffbd72" stroke-width="1.2"/>
  <text x="366" y="24" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#ffe2b8">HI!</text>
</g>
<g class="hello-b">
  <path d="M411 11h37q4 0 4 4v12q0 4-4 4h-17v5l-5-5h-15q-4 0-4-4V15q0-4 4-4z" fill="#151b2a" stroke="#66e5dc" stroke-width="1.2"/>
  <text x="430" y="24" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#c8fffa">HEY!</text>
</g>

<!-- Pip: sturdy, warm-toned helper with a broad face and compact articulated legs -->
<g class="approach-left">
 <g class="bob">
  <g transform="translate(96 0)">
   <ellipse class="shadow" cx="35" cy="85" rx="24" ry="3" fill="#10131d" opacity=".27"/>
   <path d="M34 15V9" stroke="#e8a157" stroke-width="2.4" stroke-linecap="round"/>
   <circle class="beacon" cx="34" cy="8" r="3" fill="#fff0aa" filter="url(#glow)"/>
   <path d="M12 27 4 23v20l8-3m46-13 7-4v20l-8-3" fill="url(#amber-side)" stroke="#ffc27c" stroke-width="1.5" stroke-linejoin="round"/>
   <path d="M14 17h40q10 0 10 11v19q0 9-10 9H14Q5 56 5 47V28q0-11 9-11z" fill="url(#amber-shell)" stroke="#ffe0aa" stroke-width="1.6"/>
   <path d="m53 19 11 7v20l-11 7z" fill="url(#amber-side)" stroke="#d48a53" stroke-width="1"/>
   <path d="M13 24q21-8 39 0v24q-20 8-39 0z" fill="url(#face)" stroke="#8f5945" stroke-width="1.2"/>
   <path d="M16 26q15-6 31 0" fill="none" stroke="#fff0cc" stroke-opacity=".7" stroke-width="1.2"/>
   <ellipse class="eye" cx="24" cy="36" rx="4" ry="5" fill="url(#lens)"/>
   <ellipse class="eye" cx="42" cy="36" rx="4" ry="5" fill="url(#lens)"/>
   <circle cx="25" cy="34.5" r="1.1" fill="#fff"/>
   <circle cx="43" cy="34.5" r="1.1" fill="#fff"/>
   <path d="M28 44q5 4 10 0" fill="none" stroke="#ffd28a" stroke-width="1.5" stroke-linecap="round"/>
   <path d="M15 55q20-7 39 0v18H15z" fill="url(#amber-shell)" stroke="#eeae68" stroke-width="1.5"/>
   <path d="m52 56 12 4v9l-12 4z" fill="url(#amber-side)" stroke="#ba7145" stroke-width="1"/>
   <path d="m35 58 7 5-7 5-7-5z" fill="#173642" stroke="#65e4d8" stroke-width="1.1"/>
   <circle cx="35" cy="63" r="1.2" fill="#fff1c4"/>
   <g class="swing"><path d="M17 57 9 66" stroke="#d4874c" stroke-width="4" stroke-linecap="round"/><circle cx="8" cy="67" r="3.2" fill="#9b553b" stroke="#ffd28a" stroke-width="1"/></g>
   <g class="wave"><path d="M53 57 62 49" stroke="#d4874c" stroke-width="4" stroke-linecap="round"/><circle cx="64" cy="47" r="3.5" fill="#ffcd83" stroke="#fff0cf" stroke-width="1"/></g>
   <g class="leg-a"><path d="M23 72v4l-3 4v2" fill="none" stroke="#bd7446" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="76" r="1.6" fill="#ffe0aa"/><path d="M20 82h-5l-2 2h9" fill="#743f36" stroke="#ffbd72" stroke-width="1.5" stroke-linejoin="round"/></g>
   <g class="leg-b"><path d="M47 72v4l3 4v2" fill="none" stroke="#bd7446" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="76" r="1.6" fill="#ffe0aa"/><path d="M50 82h5l2 2h-9" fill="#743f36" stroke="#ffbd72" stroke-width="1.5" stroke-linejoin="round"/></g>
  </g>
 </g>
</g>

<!-- Luma: sleek pearl-and-teal companion with a rounded face and bright side fins -->
<g class="approach-right">
 <g class="bob">
  <g transform="translate(704 0) scale(-1 1)">
   <ellipse class="shadow" cx="35" cy="85" rx="23" ry="3" fill="#10131d" opacity=".25"/>
   <path d="M32 16V11m-7 7v-5m14 5v-5" stroke="#56c8ca" stroke-width="1.8" stroke-linecap="round"/>
   <circle class="beacon" cx="32" cy="10" r="2.7" fill="#d6bdff" filter="url(#glow)"/>
   <path d="M11 28 3 24v19l9-3m47-12 7-4v19l-8-3" fill="url(#pearl-side)" stroke="#a2eeea" stroke-width="1.5" stroke-linejoin="round"/>
   <path d="M15 18q5-5 19-5 20 0 25 14v19q-4 11-24 12-21-1-27-12V29q1-7 7-11z" fill="url(#pearl-shell)" stroke="#eafff8" stroke-width="1.7"/>
   <path d="m51 19 10 8v20l-10 8z" fill="url(#pearl-side)" stroke="#6db8ba" stroke-width="1"/>
   <path d="M13 25q19-9 39 0v23q-18 9-39 0z" fill="url(#face)" stroke="#6daeb5" stroke-width="1.2"/>
   <path d="M16 27q15-7 31 0" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.2"/>
   <ellipse class="eye" cx="24" cy="37" rx="4.2" ry="5.4" fill="url(#lens)"/>
   <ellipse class="eye" cx="42" cy="37" rx="4.2" ry="5.4" fill="url(#lens)"/>
   <circle cx="25" cy="35.5" r="1.2" fill="#fff"/>
   <circle cx="43" cy="35.5" r="1.2" fill="#fff"/>
   <path d="M28 45q5 3 10 0" fill="none" stroke="#a9f5eb" stroke-width="1.5" stroke-linecap="round"/>
   <path d="M18 55q16-8 34 0v18q-17 7-34 0z" fill="url(#pearl-shell)" stroke="#8bd9d6" stroke-width="1.5"/>
   <path d="m51 56 11 4v9l-11 4z" fill="url(#pearl-side)" stroke="#5a9caa" stroke-width="1"/>
   <path d="m35 59 6 4-6 5-6-5z" fill="#282542" stroke="#cdb8ff" stroke-width="1.1"/>
   <circle cx="35" cy="63" r="1.2" fill="#fff"/>
   <g class="swing"><path d="M18 57 10 66" stroke="#6bb9b9" stroke-width="3.8" stroke-linecap="round"/><circle cx="9" cy="67" r="3" fill="#347b85" stroke="#d8fffb" stroke-width="1"/></g>
   <g class="wave"><path d="M52 57 61 49" stroke="#6bb9b9" stroke-width="3.8" stroke-linecap="round"/><circle cx="63" cy="47" r="3.3" fill="#d2bdff" stroke="#fff" stroke-width="1"/></g>
   <g class="leg-a"><path d="M23 72v4l-3 4v2" fill="none" stroke="#5cabb1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="76" r="1.5" fill="#f4fffd"/><path d="M20 82h-5l-2 2h9" fill="#315772" stroke="#bba7ff" stroke-width="1.5" stroke-linejoin="round"/></g>
   <g class="leg-b"><path d="M47 72v4l3 4v2" fill="none" stroke="#5cabb1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="76" r="1.5" fill="#f4fffd"/><path d="M50 82h5l2 2h-9" fill="#315772" stroke="#bba7ff" stroke-width="1.5" stroke-linejoin="round"/></g>
  </g>
 </g>
</g>
</svg>