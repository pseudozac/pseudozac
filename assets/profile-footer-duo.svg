<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 82" width="800" height="82" role="img" aria-labelledby="title desc">
<title id="title">Two friendly cyberpunk robots greet each other</title>
<desc id="desc">A violet robot and a teal robot walk together, wave hello, then return to their places.</desc>
<style>
@keyframes trace{to{stroke-dashoffset:-100}}
@keyframes move-left{0%,8%,92%,100%{transform:translateX(0)}40%,60%{transform:translateX(270px)}}
@keyframes move-right{0%,8%,92%,100%{transform:translateX(0)}40%,60%{transform:translateX(-270px)}}
@keyframes gait{0%,8%,38%,62%,92%,100%{transform:translateY(0)}14%,26%,34%,68%,80%,88%{transform:translateY(-1.5px)}}
@keyframes step-a{0%,8%,38%,62%,92%,100%{transform:rotate(0)}14%,26%,34%,68%,80%,88%{transform:rotate(11deg)}20%,30%,70%,84%{transform:rotate(-11deg)}}
@keyframes step-b{0%,8%,38%,62%,92%,100%{transform:rotate(0)}14%,26%,34%,68%,80%,88%{transform:rotate(-11deg)}20%,30%,70%,84%{transform:rotate(11deg)}}
@keyframes greet-wave{0%,38%,61%,100%{transform:rotate(0)}42%,46%,50%,54%,58%{transform:rotate(-40deg)}44%,48%,52%,56%{transform:rotate(-12deg)}}
@keyframes hello-left{0%,37%,50%,100%{opacity:0}40%,47%{opacity:1}}
@keyframes hello-right{0%,48%,62%,100%{opacity:0}52%,59%{opacity:1}}
@keyframes blink{0%,46%,49%,100%{transform:scaleY(1)}47.5%{transform:scaleY(.12)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.trace{animation:trace 7s linear infinite}
.left-approach{animation:move-left 8s ease-in-out infinite}
.right-approach{animation:move-right 8s ease-in-out infinite}
.gait{animation:gait 8s linear infinite}
.leg-a{transform-box:fill-box;transform-origin:top center;animation:step-a 8s linear infinite}
.leg-b{transform-box:fill-box;transform-origin:top center;animation:step-b 8s linear infinite}
.wave{transform-box:fill-box;transform-origin:39px 53px;animation:greet-wave 8s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s ease-in-out infinite}
.hello-left{opacity:0;animation:hello-left 8s ease-in-out infinite}
.hello-right{opacity:0;animation:hello-right 8s ease-in-out infinite}
.pulse{animation:pulse 2.5s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.trace,.left-approach,.right-approach,.gait,.leg-a,.leg-b,.wave,.blink,.hello-left,.hello-right,.pulse{animation:none}.hello-left,.hello-right{opacity:0}}
</style>
<path d="M0 75h300l8-8h18l8 8h28M438 75h28l8-8h18l8 8h300" fill="none" stroke="#9b65d7" stroke-opacity=".35"/>
<path class="trace" d="M0 75h300l8-8h18l8 8h28M438 75h28l8-8h18l8 8h300" fill="none" stroke="#00b8b4" stroke-width="1.2" stroke-dasharray="4 46"/>
<g class="hello-left">
  <path d="M333 3h39q4 0 4 4v9q0 4-4 4h-15l-5 5v-5h-19q-4 0-4-4V7q0-4 4-4z" fill="#171827" stroke="#9b65d7" stroke-width="1.2"/>
  <text x="352" y="14" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#d9c4ff">HI!</text>
</g>
<g class="hello-right">
  <path d="M428 3h39q4 0 4 4v9q0 4-4 4h-19v5l-5-5h-15q-4 0-4-4V7q0-4 4-4z" fill="#171827" stroke="#56ded8" stroke-width="1.2"/>
  <text x="448" y="14" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#a9fff5">HEY!</text>
</g>
<!-- Violet IZ bot -->
<g class="left-approach">
 <g class="gait">
  <g transform="translate(80 0)">
   <path d="M23 20V15" fill="none" stroke="#9b65d7" stroke-width="2"/>
   <circle class="pulse" cx="23" cy="13" r="3" fill="#56ded8"/>
   <path d="M3 31q-7-2-6 5t8 5m38-10q7-2 6 5t-8 5" fill="#201b32" stroke="#9b65d7" stroke-width="1.8"/>
   <rect x="0" y="20" width="46" height="31" rx="11" fill="#181827" stroke="#9b65d7" stroke-width="2"/>
   <rect x="4" y="24" width="38" height="22" rx="8" fill="#10232e" stroke="#3d3157" stroke-width="1"/>
   <ellipse class="blink" cx="15" cy="34" rx="3.2" ry="4.2" fill="#67f2e6"/>
   <ellipse class="blink" cx="31" cy="34" rx="3.2" ry="4.2" fill="#67f2e6"/>
   <circle cx="16" cy="32.5" r="1" fill="#fff"/>
   <circle cx="32" cy="32.5" r="1" fill="#fff"/>
   <path d="M18 41q5 4 10 0" fill="none" stroke="#c28af2" stroke-width="1.7"/>
   <path d="M8 52q15-7 30 0v14H8z" fill="#211d38" stroke="#7952b2" stroke-width="1.8"/>
   <path d="m23 53 5 3-5 3-5-3z" fill="#102c34" stroke="#56ded8" stroke-width="1.2"/>
   <text x="23" y="57.5" text-anchor="middle" font-family="monospace" font-size="4" font-weight="700" fill="#e1fffb">IZ</text>
   <path d="M11 65v8" fill="none" stroke="#9b65d7" stroke-width="2.5" class="leg-a"/>
   <path d="M35 65v8" fill="none" stroke="#9b65d7" stroke-width="2.5" class="leg-b"/>
   <path d="M7 74h9m15 0h9" fill="none" stroke="#56ded8" stroke-width="2.5"/>
   <g class="wave"><path d="M39 53 46 58" fill="none" stroke="#9b65d7" stroke-width="4"/><circle cx="47" cy="59" r="3" fill="#56ded8"/></g>
  </g>
 </g>
</g>
<!-- Teal bot: rounder head, side fins, and a mint core -->
<g class="right-approach">
 <g class="gait">
  <g transform="translate(720 0) scale(-1 1)">
   <path d="M23 20V15m-5 3v-4m10 4v-4" fill="none" stroke="#56ded8" stroke-width="1.7"/>
   <circle cx="23" cy="11" r="2.5" fill="#c28af2"/>
   <path d="M2 30q-6-3-6 4v8q0 3 7 1m40-13q7-2 8 5t-8 5" fill="#10303a" stroke="#56ded8" stroke-width="1.8"/>
   <path d="M5 21q18-8 36 0 6 5 5 17-1 13-18 14-18 0-24-9-4-9 1-22z" fill="#12252e" stroke="#56ded8" stroke-width="2"/>
   <path d="M9 28q14-7 28 0v15q-13 6-28 0z" fill="#171827" stroke="#31555b" stroke-width="1"/>
   <circle class="blink" cx="17" cy="35" r="3.1" fill="#c5a5ff"/>
   <circle class="blink" cx="30" cy="35" r="3.1" fill="#c5a5ff"/>
   <circle cx="18" cy="34" r="1" fill="#fff"/>
   <circle cx="31" cy="34" r="1" fill="#fff"/>
   <path d="M18 41q5 3 10 0" fill="none" stroke="#56ded8" stroke-width="1.6"/>
   <path d="M8 53q15-8 30 0v13H8z" fill="#17313a" stroke="#56ded8" stroke-width="1.8"/>
   <path d="m23 53 5 3-5 3-5-3z" fill="#2a1c47" stroke="#c28af2" stroke-width="1.2"/>
   <text x="23" y="57.5" text-anchor="middle" font-family="monospace" font-size="4" font-weight="700" fill="#f2eaff">07</text>
   <path d="M11 65v8" fill="none" stroke="#56ded8" stroke-width="2.5" class="leg-b"/>
   <path d="M35 65v8" fill="none" stroke="#56ded8" stroke-width="2.5" class="leg-a"/>
   <path d="M7 74h9m15 0h9" fill="none" stroke="#c28af2" stroke-width="2.5"/>
   <g class="wave"><path d="M39 53 46 58" fill="none" stroke="#56ded8" stroke-width="4"/><circle cx="47" cy="59" r="3" fill="#c28af2"/></g>
  </g>
 </g>
</g>
</svg>