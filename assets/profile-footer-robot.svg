<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 72" width="800" height="72" role="img" aria-labelledby="title desc">
<title id="title">Cyberpunk footer with a friendly IZ robot</title>
<desc id="desc">A tiny animated robot stands on a glowing cyan-violet signal trace.</desc>
<style>
@keyframes trace{to{stroke-dashoffset:-100}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes blink{0%,46%,49%,100%{transform:scaleY(1)}47.5%{transform:scaleY(.12)}}
.trace{animation:trace 7s linear infinite}
.bot{animation:bob 3.2s ease-in-out infinite;transform-origin:400px 38px}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5.2s ease-in-out infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.trace,.bot,.eye,.pulse{animation:none}}
</style>
<path d="M0 65h330l8-8h18l8 8h18m36 0h18l8-8h18l8 8h330" fill="none" stroke="#9b65d7" stroke-opacity=".3"/>
<path class="trace" d="M0 65h330l8-8h18l8 8h18m36 0h18l8-8h18l8 8h330" fill="none" stroke="#00b8b4" stroke-width="1.2" stroke-dasharray="4 46"/>
<g class="bot" stroke-linecap="round" stroke-linejoin="round">
  <path d="M400 11V6" fill="none" stroke="#9b65d7" stroke-width="2"/>
  <circle class="pulse" cx="400" cy="5" r="3" fill="#00d5cf"/>
  <path d="M374 23q-8 1-7 8t8 6m50-14q8 1 7 8t-8 6" fill="#201c35" stroke="#9b65d7" stroke-width="2"/>
  <rect x="375" y="12" width="50" height="36" rx="11" fill="#181827" stroke="#9b65d7" stroke-width="2"/>
  <path d="M381 20q19-13 38 0" fill="none" stroke="#32254b" stroke-width="2"/>
  <ellipse class="eye" cx="390" cy="29" rx="3.5" ry="5" fill="#68f4e7"/>
  <ellipse class="eye" cx="410" cy="29" rx="3.5" ry="5" fill="#68f4e7"/>
  <circle cx="391" cy="27" r="1.2" fill="#fff"/>
  <circle cx="411" cy="27" r="1.2" fill="#fff"/>
  <path d="M394 38q6 5 12 0" fill="none" stroke="#c28af2" stroke-width="2"/>
  <path d="M380 35h3m34 0h3" stroke="#00b8b4" stroke-width="2" opacity=".8"/>
  <path d="M383 49v4q0 5 6 5h22q6 0 6-5v-4" fill="#211d38" stroke="#7751b2" stroke-width="2"/>
  <path d="m400 49 5 3-5 3-5-3z" fill="#142b35" stroke="#55e6df" stroke-width="1.3"/>
  <text x="400" y="53.5" text-anchor="middle" font-family="monospace" font-size="4" font-weight="700" fill="#d8fffa">IZ</text>
  <path d="M389 58v6m22-6v6" fill="none" stroke="#9b65d7" stroke-width="2.5"/>
  <path d="M384 65h10m12 0h10" fill="none" stroke="#55e6df" stroke-width="2.5"/>
</g>
</svg>